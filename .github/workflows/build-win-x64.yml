name: Build BaeSenX Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - t_wpf
    paths:
      - 'BaeSenX/**'
      - '.github/workflows/build-win-x64.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build .NET Framework 4.8 WPF x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          msbuild BaeSenX/BaeSenX.csproj /restore /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="$PWD\publish\"

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: BaeSenX-Win10-x64
          path: publish/**
          if-no-files-found: error
          retention-days: 14
